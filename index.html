<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#6d243b"><title>Five Senses, One Love Story</title><style>:root{font-family:Georgia,serif;color:#52283a;background:#fff8f4}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#ffe3e5,#fff8f4 60%);min-height:100vh}.wrap{max-width:680px;margin:auto;padding:28px 20px 60px;text-align:center}h1{font-size:clamp(2rem,8vw,3.3rem);margin:18px 0 8px}p{line-height:1.6}.eyebrow{letter-spacing:.2em;text-transform:uppercase;font:12px Arial,sans-serif;color:#965b69}.intro{max-width:470px;margin:16px auto 28px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.gift{border:1px solid #e9c4c7;background:#fff;border-radius:18px;padding:22px 8px;min-height:140px;box-shadow:0 6px 18px #68283b12;cursor:pointer;color:#64283d}.gift:last-child{grid-column:1/-1}.gift .emoji{display:block;font-size:34px;margin-bottom:12px}.gift b{font:700 15px Arial,sans-serif;letter-spacing:.12em}.gift small{display:block;margin-top:9px;color:#9d6d78;font:12px Arial,sans-serif}.gift:focus-visible,.close:focus-visible{outline:3px solid #a54366}dialog{border:0;border-radius:22px;padding:30px 24px;max-width:min(92vw,440px);box-shadow:0 20px 70px #33121b55;color:#52283a;text-align:center}dialog::backdrop{background:#351423aa}dialog h2{font-size:30px;margin:10px 0}.close,.link{background:#762a48;color:white;border:0;border-radius:30px;padding:13px 20px;font:600 14px Arial,sans-serif;cursor:pointer;display:inline-block;text-decoration:none;margin:8px 4px}.link{background:#f4e2e7;color:#67263f}.foot{margin-top:35px;color:#a06e7b;font-style:italic}.hint{font:12px Arial,sans-serif;color:#986877;margin-top:18px}</style></head><body><main class="wrap"><div class="eyebrow">A Christmas surprise for Daniel</div><h1>Five Senses,<br>One Love Story ♡</h1><p class="intro">Five little surprises, five ways to make memories together. Pick any sense to discover your next gift. There is no right order — just follow your heart.</p><div class="grid" id="gifts"></div><p class="foot">Made with love, just for you ♡</p></main><dialog id="reveal"><div id="details"></div><button class="close" onclick="document.getElementById('reveal').close()">Back to the five senses</button></dialog><script>const gifts=[{id:'touch',emoji:'🫶',name:'TOUCH',title:'Our Private Escape',description:'Open your TOUCH bag. Two hours to relax together, just us.',detail:'Private spa · December 27 · 5:30–7:30 PM',linkText:'Spa booking details',link:''},{id:'smell',emoji:'🌸',name:'SMELL',title:'A Little Care Wherever You Go',description:'Open your SMELL bag. A little self-care kit made especially for you.',detail:'Something to keep close.'},{id:'sight',emoji:'🎬',name:'SIGHT',title:'Our Cozy Movie Date',description:'Open your SIGHT bag. The Notebook, Christmas treats, candlelight, and a cozy night together.',detail:'Movie night · Date to be chosen together'},{id:'taste',emoji:'☕',name:'TASTE',title:'A Sweet Morning Together',description:'Open your TASTE bag. Gingerbread mugs, hot cocoa, pancakes, and a little Christmas breakfast made together.',detail:'Our kitchen · Whenever we feel like it'},{id:'sound',emoji:'🎶',name:'SOUND',title:'Listen to the Magic',description:'Open your SOUND bag. First, a little voice message from me. Then a magical evening where music meets light.',detail:'LUMAGICA Hanau · December 28 · Entry 7:00–7:30 PM',linkText:'Event tickets',link:''}];const seen=new Set();const grid=document.getElementById('gifts');const modal=document.getElementById('reveal');const details=document.getElementById('details');function draw(){grid.innerHTML='';for(const g of gifts){const b=document.createElement('button');b.className='gift';b.innerHTML=`<span class="emoji">${g.emoji}</span><b>${g.name}</b><small>${seen.has(g.id)?'♡ Discovered':'Tap to reveal'}</small>`;b.onclick=()=>{seen.add(g.id);details.innerHTML=`<div style="font-size:44px">${g.emoji}</div><div class="eyebrow">${g.name}</div><h2>${g.title}</h2><p>${g.description}</p><p><strong>${g.detail}</strong></p>${g.link?`<a class="link" href="${g.link}" target="_blank" rel="noopener noreferrer">${g.linkText}</a>`:''}<p class="hint">Open the matching bag to find your surprise ♡</p>`;modal.showModal();draw()};grid.appendChild(b)}}draw();</script></body></html>
